<!DOCTYPE html>
<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="assets/css/game.css">
    </head>

    <body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
            <ul class="navbar-nav">
                <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="#">Features</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="#">Pricing</a>
                </li>
                <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    Dropdown link
                </a>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">Action</a></li>
                    <li><a class="dropdown-item" href="#">Another action</a></li>
                    <li><a class="dropdown-item" href="#">Something else here</a></li>
                </ul>
                </li>
            </ul>
            </div>
        </div>
        </nav>
        
        <div class="container">
            <div class="row">
                
                <div class="col-lg-2 mb-3 col-md-3 col-sm-6">
                    <label for="selectRows" class="form-label "># of Rows</label>
                    <select class="form-control" id="selectRows">

                    </select>
                    <span class="text-danger txt-xs" id="spanNRows" hidden>This is required.</span>

                </div>
                <div class="col-lg-2 mb-3 col-md-3 col-sm-6">
                    <label for="selectColumns" class="form-label "># of Columns</label>
                    <select class="form-control" id="selectColumns">

                    </select>
                    <span class="text-danger txt-xs" id="spanNColumns" hidden>This is required.</span>

                </div>
                <div class="col-lg-2 mb-3 col-md-3 col-sm-6">
                    <label for="selectBombs" class="form-label "># of Bombs</label>
                    <select class="form-control" id="selectBombs">

                    </select>
                    <span class="text-danger txt-xs" id="spanNBombs" hidden>This is required.</span>
                </div>


                <div class="col-lg-2 mb-3 col-md-3 col-sm-6">
                    <label for="inputBetAmount" class="form-label ">Bet Amount</label>
                    <input type="number" class="form-control" id="inputBetAmount" placeholder="Enter bet amount">
                    <span class="text-danger txt-xs" id="spanBetAmount" hidden>This is required.</span>
                </div>

                <button class="btn btn-sm btn-outline-primary col-lg-1" onclick="generateGame()">Generate Game</button>

                <button class="btn btn-sm btn-outline-primary col-lg-1" onclick="claim()">Claim</button>

                <div class="col-lg-12 border p-3 " id="gameDisplay">


                </div>
            </div>
        </div>
        
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        
        <script src="assets/js/game.js"></script>
    </body>
</html>
